version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: myapp:dev
    ports:
      - "5000:5000"
    environment:
      # Подставьте реальные значения или используйте .env (см. ниже)
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=YtReWq4321
      - DATABASE_NAME=virtd
      - TABLE_NAME=${TABLE_NAME:-my_table}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=appdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
